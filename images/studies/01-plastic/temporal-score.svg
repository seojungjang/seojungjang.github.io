<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="t d">
<title id="t">Plastic Movement: thirty-minute cue structure and selected effect shapes</title>
<desc id="d">Cue counts in six five-minute bins: 16, 16, 64, 5, 2, and 2; 105 cues before the restart marker at minute 30. Effect 5 appears early, and Effect 1 is repeatedly started and stopped between 10:08 and 14:56. Effect 3 was stored but unused. Waveforms below are qualitative redrawings of Eos effect definitions, not measured light output.</desc>
<defs><style>.mono{font:500 17px 'IBM Plex Mono',monospace;letter-spacing:1px;fill:#8a9189}.title{font:600 42px 'IBM Plex Sans',Arial,sans-serif;fill:#eff0e9}.sub{font:19px 'IBM Plex Sans',Arial,sans-serif;fill:#bac3ba}.small{font:16px 'IBM Plex Sans',Arial,sans-serif;fill:#aab5ac}.tick{font:17px 'IBM Plex Mono',monospace;fill:#c7d0c7}.value{font:600 25px 'IBM Plex Sans',Arial,sans-serif;fill:#f1eee6}.box{font:600 20px 'IBM Plex Sans',Arial,sans-serif;fill:#eff0e9}</style></defs>
