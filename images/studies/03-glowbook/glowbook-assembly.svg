<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">Glowbook reconstructed component layers</title>
<desc id="d">Exploded conceptual view of the translucent upper page, LED elements, cut book cavity, battery, voltage converter, ESP8266 controller and book body, based on the worktable photographs and original sketch. It is not a measured section or a wiring diagram.</desc>
