  <style>.mono{font:500 18px 'IBM Plex Mono',monospace;letter-spacing:1.4px;fill:#6f766f}.title{font:600 48px 'IBM Plex Sans',Arial,sans-serif;fill:#29312d}.lead{font:22px 'IBM Plex Sans',Arial,sans-serif;fill:#59635b}.label{font:600 22px 'IBM Plex Sans',Arial,sans-serif;fill:#303832}.note{font:16px 'IBM Plex Sans',Arial,sans-serif;fill:#717b73}</style>
</defs>
