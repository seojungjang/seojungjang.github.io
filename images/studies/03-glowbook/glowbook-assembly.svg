<text x="66" y="369" class="label">02  LED elements</text><text x="66" y="398" class="note">Matrix and edge light in the bench test</text>
<text x="66" y="464" class="label">03  Cut-out book cavity</text><text x="66" y="493" class="note">Space for the light and power package</text>
<text x="66" y="559" class="label">04  Power + control package</text><text x="66" y="588" class="note">12 V pack · converter · ESP8266</text>
